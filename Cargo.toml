[package]
name = "esp32-cyd-aquarium-rs"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Animated pixel aquarium for the ESP32-2432S028R (Cheap Yellow Display), ported from esp32-cyd-aquarium"
resolver = "2"

[lib]
name = "aquarium"
path = "src/lib.rs"

[[bin]]
name = "esp32-cyd-aquarium-rs"
path = "src/main.rs"
required-features = ["hardware"]

[features]
default = ["hardware"]
hardware = [
    "dep:anyhow",
    "dep:embedded-hal",
    "dep:embedded-svc",
    "dep:esp-idf-hal",
    "dep:esp-idf-svc",
    "dep:esp-idf-sys",
    "dep:esp32-nimble",
    "dep:log",
    "dep:mipidsi",
    "dep:serde_json",
    "dep:toml-cfg",
]

[dependencies]
embedded-graphics-core = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }

# Hardware crates only build for the ESP-IDF target. They are target-gated so
# that `cargo test` works on a regular host machine.
[target.'cfg(target_os = "espidf")'.dependencies]
anyhow = { version = "1", optional = true }
log = { version = "0.4", optional = true }
toml-cfg = { version = "0.2", optional = true }
embedded-hal = { version = "1", optional = true }
embedded-svc = { version = "0.29.0", optional = true }
esp-idf-sys = { version = "0.37.2", features = ["binstart"], optional = true }
esp-idf-hal = { version = "0.46.2", optional = true }
esp-idf-svc = { version = "0.52.1", optional = true }
esp32-nimble = { version = "0.12.0", optional = true }
mipidsi = { version = "0.10", optional = true }

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

[dev-dependencies]
toml = "0.8"

[profile.release]
opt-level = "s"
lto = true
