[package]
name = "esp32-cyd-aquarium-rs"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Animated pixel aquarium for the ESP32-2432S028R (Cheap Yellow Display), ported from esp32-cyd-aquarium"
resolver = "2"

[lib]
name = "aquarium"
path = "src/lib.rs"

[[bin]]
name = "esp32-cyd-aquarium-rs"
path = "src/main.rs"

[dependencies]
embedded-graphics-core = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Hardware crates only build for the ESP-IDF target. They are target-gated so
# that `cargo test` works on a regular host machine.
[target.'cfg(target_os = "espidf")'.dependencies]
anyhow = "1"
log = "0.4"
toml-cfg = "0.2"
embedded-hal = "1"
embedded-svc = "0.28"
esp-idf-sys = { version = "0.36", features = ["binstart"] }
esp-idf-hal = "0.45"
esp-idf-svc = "0.51"
mipidsi = "0.10"

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

[dev-dependencies]
toml = "0.8"

[profile.release]
opt-level = "s"
lto = true
